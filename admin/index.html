<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso administrativo | EducaPro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 40px 34px;
      box-shadow: 0 15px 45px rgba(15, 42, 77, 0.12);
      border: 1px solid #e8edf4;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo img {
      width: 170px;
      max-width: 80%;
    }

    .title {
      text-align: center;
      color: #0d2b4d;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #d7dee8;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: #0d5ea8;
      box-shadow: 0 0 0 3px rgba(13, 94, 168, 0.10);
    }

    .login-button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: #0d2b4d;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .login-button:hover {
      background: #123f6c;
    }

    .security {
      text-align: center;
      margin-top: 24px;
      color: #718096;
      font-size: 12px;
    }

    .security span {
      color: #16805c;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }

      .title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="logo">
        <img src="../img/logo-educapro.png" alt="EducaPro">
      </div>

      <h1 class="title">Acceso Administrativo</h1>

      <p class="subtitle">
        Panel de gestión de EducaPro
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="usuario">Usuario</label>
          <input
            type="text"
            id="usuario"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-button">
          Iniciar sesión
        </button>

      </form>

      <div class="security">
        🔒 <span>Área restringida</span>
      </div>

    </div>

    <div class="footer">
      © EducaPro Formación y Certificación
    </div>

  </div>

  <script>
 <script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const usuario =
        document.getElementById("usuario").value.trim();

      const password =
        document.getElementById("password").value;

      const boton =
        document.querySelector(".login-button");

      boton.disabled = true;
      boton.textContent = "Verificando...";

      try {

        const respuesta = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            usuario: usuario,
            password: password
          })
        });

        const resultado = await respuesta.json();

        if (resultado.success) {

          window.location.href = "/admin/panel.html";

        } else {

          alert(resultado.message || "Usuario o contraseña incorrectos.");

          boton.disabled = false;
          boton.textContent = "Iniciar sesión";
        }

      } catch (error) {

        alert("No se pudo conectar con el servidor.");

        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
      }

    });
</script>
  </script>

</body>
</html>
